services:
  web1:
    build: .
    container_name: codyssy-web-1
    ports:
      - "8081:80"
    command: /bin/sh -c "echo '<h1>WEB 1 server</h1>' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"

  web2:
    build: .
    container_name: codyssy-web-2
    ports:
      - "8082:80"
    command: /bin/sh -c "echo '<h1>WEB 2 server</h1>' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"

  lb:
    image: nginx:latest
    container_name: codyssy-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2